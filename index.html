
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-sans)}
body{background:#f4f6f9;min-height:100vh}
.topbar{background:#185FA5;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{color:#fff;font-size:20px;font-weight:500;display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nav{display:flex;gap:4px}
.nav-btn{padding:8px 18px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,0.75);font-size:15px;cursor:pointer;font-weight:400;transition:0.15s}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
.add-btn{padding:10px 20px;border-radius:8px;border:none;background:#fff;color:#185FA5;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;transition:0.15s}
.add-btn:hover{background:#E6F1FB}
.main{max-width:960px;margin:0 auto;padding:1.5rem}
.page{display:none}
.page.active{display:block}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat{background:#fff;border-radius:12px;padding:1.25rem 1rem;text-align:center;border:0.5px solid #e0e0e0}
.stat-num{font-size:36px;font-weight:500;margin-bottom:4px}
.stat-num.blue{color:#185FA5}
.stat-num.amber{color:#BA7517}
.stat-num.green{color:#3B6D11}
.stat-num.gray{color:#5F5E5A}
.stat-label{font-size:14px;color:#888}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:18px;font-weight:500;color:#1a1a1a}
.card{background:#fff;border-radius:12px;border:0.5px solid #e0e0e0;overflow:hidden;margin-bottom:1.5rem}
.apt-row{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:16px;padding:16px 20px;border-bottom:0.5px solid #f0f0f0;transition:0.15s}
.apt-row:last-child{border-bottom:none}
.apt-row:hover{background:#f8fafc}
.time-box{text-align:center}
.time-main{font-size:22px;font-weight:500;color:#185FA5;line-height:1}
.time-sub{font-size:12px;color:#999;margin-top:3px}
.apt-name{font-size:17px;font-weight:500;color:#1a1a1a;margin-bottom:4px}
.apt-detail{font-size:14px;color:#888}
.apt-actions{display:flex;gap:8px;align-items:center}
.badge{font-size:13px;padding:4px 12px;border-radius:20px;font-weight:500;white-space:nowrap}
.badge.bekleyen{background:#E6F1FB;color:#0C447C}
.badge.tamamlandi{background:#EAF3DE;color:#27500A}
.badge.bugun{background:#FAEEDA;color:#633806}
.action-btn{width:38px;height:38px;border-radius:8px;border:0.5px solid #e0e0e0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:#555;transition:0.15s}
.action-btn:hover{background:#f0f0f0}
.action-btn.green:hover{background:#EAF3DE;color:#27500A;border-color:#c0dd97}
.action-btn.red:hover{background:#FCEBEB;color:#791F1F;border-color:#f7c1c1}
.empty-state{text-align:center;padding:3rem;color:#aaa}
.empty-state i{font-size:48px;display:block;margin-bottom:12px}
.empty-state p{font-size:16px}

.search-bar{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.search-bar input,.search-bar select{font-size:15px;padding:10px 14px;border-radius:8px;border:0.5px solid #d0d0d0;background:#fff;color:#1a1a1a;flex:1;min-width:140px}

.cust-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:16px;padding:16px 20px;border-bottom:0.5px solid #f0f0f0;transition:0.15s}
.cust-row:last-child{border-bottom:none}
.cust-row:hover{background:#f8fafc}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#fff}
.cust-name{font-size:16px;font-weight:500;color:#1a1a1a;margin-bottom:3px}
.cust-detail{font-size:13px;color:#888}
.cust-apt-btn{padding:8px 16px;border-radius:8px;border:0.5px solid #185FA5;background:#E6F1FB;color:#0C447C;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:0.15s}
.cust-apt-btn:hover{background:#185FA5;color:#fff}

.overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:50;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;overflow:hidden}
.modal-top{background:#185FA5;padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.modal-top h2{color:#fff;font-size:18px;font-weight:500}
.modal-close{width:36px;height:36px;border-radius:8px;border:none;background:rgba(255,255,255,0.2);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:1.5rem;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:14px;font-weight:500;color:#555;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:8px;border:0.5px solid #d0d0d0;background:#fff;color:#1a1a1a;font-size:15px;font-family:inherit}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-foot{padding:1rem 1.5rem;border-top:0.5px solid #eee;display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{padding:10px 20px;border-radius:8px;border:0.5px solid #d0d0d0;background:#fff;color:#555;font-size:15px;cursor:pointer}
.btn-save{padding:10px 24px;border-radius:8px;border:none;background:#185FA5;color:#fff;font-size:15px;font-weight:500;cursor:pointer}
.btn-save:hover{background:#0C447C}
.wrap{position:relative;min-height:600px}
</style>

<h2 class="sr-only">BerberPro - Randevu yönetim sistemi. Bugünün randevuları, müşteri listesi ve randevu ekleme özellikleri.</h2>

<div class="wrap" id="app">
<div class="topbar">
  <div class="logo"><div class="logo-icon"><i class="ti ti-scissors" aria-hidden="true"></i></div>BerberPro</div>
  <div class="nav">
    <button class="nav-btn active" onclick="goPage('panel',this)"><i class="ti ti-home" aria-hidden="true"></i> Ana Sayfa</button>
    <button class="nav-btn" onclick="goPage('randevular',this)"><i class="ti ti-calendar" aria-hidden="true"></i> Randevular</button>
    <button class="nav-btn" onclick="goPage('musteriler',this)"><i class="ti ti-users" aria-hidden="true"></i> Müşteriler</button>
  </div>
  <button class="add-btn" onclick="openModal()"><i class="ti ti-plus" aria-hidden="true"></i> Yeni Randevu</button>
</div>

<div class="main">

<div id="pg-panel" class="page active">
  <div style="margin-bottom:1.5rem">
    <div style="font-size:24px;font-weight:500;color:#1a1a1a;margin-bottom:4px">Merhaba! 👋</div>
    <div style="font-size:15px;color:#888" id="tarih-label"></div>
  </div>
  <div class="stats" id="stats-area"></div>
  <div class="section-head"><span class="section-title"><i class="ti ti-calendar-today" aria-hidden="true" style="color:#185FA5;margin-right:6px"></i>Bugünün Randevuları</span></div>
  <div class="card" id="bugun-liste"></div>
  <div class="section-head" style="margin-top:1.5rem"><span class="section-title"><i class="ti ti-clock" aria-hidden="true" style="color:#BA7517;margin-right:6px"></i>Yaklaşan Randevular</span></div>
  <div class="card" id="yaklasan-liste"></div>
</div>

<div id="pg-randevular" class="page">
  <div class="section-head"><span class="section-title">Tüm Randevular</span></div>
  <div class="search-bar">
    <input type="text" id="s-isim" placeholder="🔍  Müşteri adı ara..." oninput="renderRandevular()">
    <input type="date" id="s-tarih" onchange="renderRandevular()">
    <select id="s-durum" onchange="renderRandevular()">
      <option value="">Tüm Durumlar</option>
      <option value="bekleyen">Bekleyen</option>
      <option value="tamamlandi">Tamamlandı</option>
    </select>
  </div>
  <div class="card" id="apt-liste"></div>
</div>

<div id="pg-musteriler" class="page">
  <div class="section-head"><span class="section-title">Müşteriler</span></div>
  <div class="search-bar">
    <input type="text" id="s-musteri" placeholder="🔍  Müşteri ara..." oninput="renderMusteriler()">
  </div>
  <div class="card" id="cust-liste"></div>
</div>

</div>

<div class="overlay" id="modal-overlay">
<div class="modal">
  <div class="modal-top">
    <h2 id="modal-baslik">Yeni Randevu Ekle</h2>
    <button class="modal-close" onclick="closeModal()" aria-label="Kapat"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div class="field"><label>Müşteri Adı</label><input id="f-isim" type="text" placeholder="Adı ve soyadı yaz..."></div>
    <div class="field"><label>Telefon Numarası</label><input id="f-tel" type="tel" placeholder="05XX XXX XX XX"></div>
    <div class="field-row">
      <div class="field"><label>Tarih</label><input id="f-tarih" type="date"></div>
      <div class="field"><label>Saat</label><input id="f-saat" type="time"></div>
    </div>
    <div class="field"><label>Yapılacak İşlem</label>
      <select id="f-islem">
        <option value="">Seçin...</option>
        <option>Saç Kesimi</option>
        <option>Sakal Tıraşı</option>
        <option>Saç + Sakal</option>
        <option>Çocuk Saç Kesimi</option>
        <option>Saç Boyama</option>
        <option>Cilt Bakımı</option>
        <option>Komple Bakım</option>
      </select>
    </div>
    <div class="field"><label>Not (İsteğe bağlı)</label><textarea id="f-not" placeholder="Örnek: Kısa kes, boyasız yap..."></textarea></div>
  </div>
  <div class="modal-foot">
    <button class="btn-cancel" onclick="closeModal()">Vazgeç</button>
    <button class="btn-save" onclick="kaydet()"><i class="ti ti-check" aria-hidden="true"></i> Kaydet</button>
  </div>
</div>
</div>
</div>

<script>
let randevular=[];let editId=null;const SK='berberpro2_data';
const RENKLER=['#185FA5','#3B6D11','#993C1D','#BA7517','#534AB7','#0F6E56'];

async function yukle(){
  try{const r=await window.storage.get(SK);if(r)randevular=JSON.parse(r.value);}catch(e){randevular=[];}
  if(!randevular.length)ornek();
  init();
}
async function kaydet_storage(){try{await window.storage.set(SK,JSON.stringify(randevular));}catch(e){}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function bugun(){return new Date().toISOString().slice(0,10)}

function ornek(){
  const b=bugun();
  const yarin=new Date();yarin.setDate(yarin.getDate()+1);const y=yarin.toISOString().slice(0,10);
  randevular=[
    {id:uid(),isim:'Ahmet Yılmaz',tel:'0532 111 22 33',tarih:b,saat:'09:00',islem:'Saç Kesimi',not:'Kısa kes',durum:'tamamlandi'},
    {id:uid(),isim:'Mehmet Kaya',tel:'0545 222 33 44',tarih:b,saat:'10:30',islem:'Saç + Sakal',not:'',durum:'tamamlandi'},
    {id:uid(),isim:'Ali Demir',tel:'0533 333 44 55',tarih:b,saat:'12:00',islem:'Sakal Tıraşı',not:'',durum:'bekleyen'},
    {id:uid(),isim:'Burak Şahin',tel:'0544 444 55 66',tarih:b,saat:'14:00',islem:'Saç Kesimi',not:'Üstten kıs',durum:'bekleyen'},
    {id:uid(),isim:'Emre Arslan',tel:'0555 555 66 77',tarih:b,saat:'16:30',islem:'Komple Bakım',not:'Düzenli müşteri',durum:'bekleyen'},
    {id:uid(),isim:'Yusuf Çelik',tel:'0506 666 77 88',tarih:y,saat:'10:00',islem:'Saç Boyama',not:'',durum:'bekleyen'},
    {id:uid(),isim:'Hasan Aydın',tel:'0531 777 88 99',tarih:y,saat:'11:30',islem:'Saç Kesimi',not:'',durum:'bekleyen'},
  ];
  kaydet_storage();
}

function init(){
  document.getElementById('tarih-label').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('f-tarih').value=bugun();
  renderHepsi();
}

function renderHepsi(){renderStats();renderBugun();renderYaklasan();renderRandevular();renderMusteriler();}

function renderStats(){
  const b=bugun();
  const bugunkiler=randevular.filter(r=>r.tarih===b);
  const tamamlanan=randevular.filter(r=>r.durum==='tamamlandi').length;
  const bekleyen=randevular.filter(r=>r.durum==='bekleyen'&&r.tarih>=b).length;
  const yaklasan=randevular.filter(r=>r.tarih>b).length;
  document.getElementById('stats-area').innerHTML=`
    <div class="stat"><div class="stat-num blue">${bugunkiler.length}</div><div class="stat-label">Bugün</div></div>
    <div class="stat"><div class="stat-num amber">${bekleyen}</div><div class="stat-label">Bekleyen</div></div>
    <div class="stat"><div class="stat-num green">${tamamlanan}</div><div class="stat-label">Tamamlanan</div></div>
    <div class="stat"><div class="stat-num gray">${yaklasan}</div><div class="stat-label">Yaklaşan</div></div>`;
}

function aptSatir(r,tarihGoster){
  const b=bugun();
  const badgeClass=r.durum==='tamamlandi'?'tamamlandi':r.tarih===b?'bugun':'bekleyen';
  const badgeText=r.durum==='tamamlandi'?'Tamamlandı':r.tarih===b?'Bugün':'Bekleyen';
  const tarihStr=tarihGoster?`<div class="time-sub">${fmtTarih(r.tarih)}</div>`:'';
  return `<div class="apt-row">
    <div class="time-box"><div class="time-main">${r.saat}</div>${tarihStr}</div>
    <div>
      <div class="apt-name">${esc(r.isim)}</div>
      <div class="apt-detail">${esc(r.islem)}${r.tel?' &nbsp;·&nbsp; '+esc(r.tel):''}${r.not?' &nbsp;·&nbsp; '+esc(r.not.slice(0,30)):''}</div>
    </div>
    <div class="apt-actions">
      <span class="badge ${badgeClass}">${badgeText}</span>
      ${r.durum==='bekleyen'?`<button class="action-btn green" onclick="tamam('${r.id}')" title="Tamamlandı olarak işaretle"><i class="ti ti-check" aria-hidden="true"></i></button>`:''}
      <button class="action-btn" onclick="openModal('${r.id}')" title="Düzenle"><i class="ti ti-edit" aria-hidden="true"></i></button>
      <button class="action-btn red" onclick="sil('${r.id}')" title="Sil"><i class="ti ti-trash" aria-hidden="true"></i></button>
    </div>
  </div>`;
}

function renderBugun(){
  const b=bugun();
  const liste=randevular.filter(r=>r.tarih===b).sort((a,c)=>a.saat.localeCompare(c.saat));
  document.getElementById('bugun-liste').innerHTML=liste.length?liste.map(r=>aptSatir(r,false)).join(''):`<div class="empty-state"><i class="ti ti-calendar-off" aria-hidden="true"></i><p>Bugün randevu yok</p></div>`;
}

function renderYaklasan(){
  const b=bugun();
  const liste=randevular.filter(r=>r.tarih>b&&r.durum==='bekleyen').sort((a,c)=>a.tarih.localeCompare(c.tarih)||a.saat.localeCompare(c.saat)).slice(0,4);
  document.getElementById('yaklasan-liste').innerHTML=liste.length?liste.map(r=>aptSatir(r,true)).join(''):`<div class="empty-state"><i class="ti ti-calendar" aria-hidden="true"></i><p>Yaklaşan randevu yok</p></div>`;
}

function renderRandevular(){
  const q=(document.getElementById('s-isim').value||'').toLowerCase();
  const ft=document.getElementById('s-tarih').value;
  const fd=document.getElementById('s-durum').value;
  let liste=[...randevular];
  if(q)liste=liste.filter(r=>r.isim.toLowerCase().includes(q));
  if(ft)liste=liste.filter(r=>r.tarih===ft);
  if(fd)liste=liste.filter(r=>r.durum===fd);
  liste.sort((a,c)=>a.tarih.localeCompare(c.tarih)||a.saat.localeCompare(c.saat));
  document.getElementById('apt-liste').innerHTML=liste.length?liste.map(r=>aptSatir(r,true)).join(''):`<div class="empty-state"><i class="ti ti-search" aria-hidden="true"></i><p>Sonuç bulunamadı</p></div>`;
}

function renderMusteriler(){
  const q=(document.getElementById('s-musteri').value||'').toLowerCase();
  const map={};
  randevular.forEach(r=>{
    if(q&&!r.isim.toLowerCase().includes(q))return;
    if(!map[r.isim])map[r.isim]={isim:r.isim,tel:r.tel,sayi:0,son:''};
    map[r.isim].sayi++;
    if(r.tarih>map[r.isim].son)map[r.isim].son=r.tarih;
  });
  const liste=Object.values(map).sort((a,c)=>a.isim.localeCompare(c.isim,'tr'));
  const init=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('cust-liste').innerHTML=liste.length?liste.map((c,i)=>`
    <div class="cust-row">
      <div class="avatar" style="background:${RENKLER[i%RENKLER.length]}">${init(c.isim)}</div>
      <div>
        <div class="cust-name">${esc(c.isim)}</div>
        <div class="cust-detail">${c.tel?esc(c.tel)+' &nbsp;·&nbsp; ':''} ${c.sayi} randevu &nbsp;·&nbsp; Son: ${c.son?fmtTarih(c.son):'—'}</div>
      </div>
      <button class="cust-apt-btn" onclick="yeniRandevuIcin('${esc(c.isim)}','${esc(c.tel)}')"><i class="ti ti-plus" aria-hidden="true"></i> Randevu</button>
    </div>`).join(''):`<div class="empty-state"><i class="ti ti-users" aria-hidden="true"></i><p>Müşteri bulunamadı</p></div>`;
}

function fmtTarih(d){return new Date(d+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function goPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pg-'+id).classList.add('active');
  btn.classList.add('active');
}

function openModal(id){
  editId=id||null;
  const r=id?randevular.find(x=>x.id===id):null;
  document.getElementById('modal-baslik').textContent=id?'Randevuyu Düzenle':'Yeni Randevu Ekle';
  document.getElementById('f-isim').value=r?r.isim:'';
  document.getElementById('f-tel').value=r?r.tel:'';
  document.getElementById('f-tarih').value=r?r.tarih:bugun();
  document.getElementById('f-saat').value=r?r.saat:'';
  document.getElementById('f-islem').value=r?r.islem:'';
  document.getElementById('f-not').value=r?r.not:'';
  document.getElementById('modal-overlay').classList.add('open');
}

function yeniRandevuIcin(isim,tel){
  openModal();
  document.getElementById('f-isim').value=isim;
  document.getElementById('f-tel').value=tel;
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editId=null;}

function kaydet(){
  const isim=document.getElementById('f-isim').value.trim();
  const tarih=document.getElementById('f-tarih').value;
  const saat=document.getElementById('f-saat').value;
  const islem=document.getElementById('f-islem').value;
  if(!isim||!tarih||!saat||!islem){alert('Lütfen adı, tarihi, saati ve işlemi doldurun!');return;}
  const data={isim,tel:document.getElementById('f-tel').value.trim(),tarih,saat,islem,not:document.getElementById('f-not').value.trim()};
  if(editId){
    const i=randevular.findIndex(r=>r.id===editId);
    randevular[i]={...randevular[i],...data};
  } else {
    randevular.push({id:uid(),...data,durum:'bekleyen'});
  }
  kaydet_storage();closeModal();renderHepsi();
}

function tamam(id){
  const r=randevular.find(x=>x.id===id);
  if(r)r.durum='tamamlandi';
  kaydet_storage();renderHepsi();
}

function sil(id){
  if(!confirm('Bu randevuyu silmek istediğinizden emin misiniz?'))return;
  randevular=randevular.filter(r=>r.id!==id);
  kaydet_storage();renderHepsi();
}

yukle();
</script>
